<html lang="zh-CN">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, user-scalable=no">
<title>凑整法消消乐 - 小升初简便运算</title>
<style>
:root{--bg:#FFF8E7;--gr:#58CC02;--gd:#46A302;--bl:#1CB0F6;--bd:#1899D6;--or:#FF9600;--od:#E08500;--pu:#CE82FF;--pd:#A568CC;--rd:#FF4B4B;--go:#FFC800;--tx:#4B4B4B;--tl:#777;--cs:0 4px 0 rgba(0,0,0,0.12);--cr:18px}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;min-height:100%;overflow-x:hidden}
body{font-family:'PingFang SC','Microsoft YaHei','Helvetica Neue',sans-serif;background:var(--bg);display:flex;flex-direction:column;align-items:center;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
#pc{position:fixed;inset:0;z-index:999;pointer-events:none}
.gw{width:100%;max-width:460px;padding:12px 16px 24px;display:flex;flex-direction:column;min-height:100vh;position:relative;z-index:1}
.gh{display:flex;align-items:center;gap:10px;padding:8px 0 6px}
.mc{width:48px;height:48px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:28px;flex-shrink:0;box-shadow:0 2px 8px rgba(0,0,0,.08);transition:transform .3s}
.mc.bn{animation:mb .5s}@keyframes mb{0%,100%{transform:translateY(0)}40%{transform:translateY(-14px)}60%{transform:translateY(-6px)}}
.hi{flex:1}.ht{font-size:18px;font-weight:800;color:var(--tx);line-height:1.2}.hs{font-size:11px;color:var(--tl);font-weight:600}
.sp{background:#fff;border-radius:50px;padding:8px 14px;font-size:14px;font-weight:800;color:var(--gr);white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,.06);display:flex;align-items:center;gap:4px}
.sp em{font-style:normal;font-size:11px;color:var(--tl);margin-left:2px}
.ps{padding:10px 0 6px}.pbw{background:#E5E0D5;border-radius:50px;height:14px;overflow:hidden;position:relative}
.pbf{height:100%;border-radius:50px;background:linear-gradient(90deg,var(--gr),#7CE82A);transition:width .6s cubic-bezier(.4,0,.2,1);position:relative}
.pbf::after{content:'';position:absolute;top:2px;left:6px;right:6px;height:4px;border-radius:2px;background:rgba(255,255,255,.35)}
.pl{display:flex;justify-content:space-between;font-size:10px;color:var(--tl);font-weight:700;margin-top:4px}
.pstar{font-size:12px;letter-spacing:2px}
.rb{text-align:center;padding:8px 0 4px;font-size:12px;font-weight:800;color:var(--tl);letter-spacing:.5px}
.rb span{display:inline-block;padding:3px 12px;background:#fff;border-radius:50px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.cs{display:flex;flex-direction:column;gap:16px;margin-top:8px;flex:1}
.sl{font-size:11px;font-weight:700;color:var(--tl);text-align:center;letter-spacing:1px}
.cr{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.cc{flex:1;min-width:100px;max-width:140px;background:#fff;border-radius:var(--cr);padding:16px 10px;text-align:center;cursor:pointer;box-shadow:var(--cs);border:3px solid transparent;transition:transform .15s cubic-bezier(.34,1.56,.64,1),box-shadow .15s,border-color .15s;position:relative}
.cc:active{transform:scale(.92);box-shadow:0 1px 0 rgba(0,0,0,.12)}
.cc.sel{border-color:var(--bl);box-shadow:0 0 0 4px rgba(28,176,246,.25),var(--cs);transform:scale(1.04)}
.cc.mt{border-color:var(--gr);background:#F0FFE0;pointer-events:none;animation:cm .5s ease forwards}
.cc.wf{border-color:var(--rd);animation:cs2 .4s ease}
.cc.hd{opacity:0;transform:scale(.8);pointer-events:none}
.ci{font-size:22px;margin-bottom:4px}.ce{font-size:17px;font-weight:800;color:var(--tx);letter-spacing:.5px;line-height:1.3}.ch{font-size:10px;color:var(--tl);font-weight:600;margin-top:3px}
@keyframes cm{0%{transform:scale(1.04)}50%{transform:scale(1.12)}100%{transform:scale(1);opacity:.6}}
@keyframes cs2{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.ac{flex:1;min-width:100px;max-width:140px;border-radius:var(--cr);padding:18px 10px;text-align:center;cursor:pointer;box-shadow:var(--cs);border:none;transition:transform .15s cubic-bezier(.34,1.56,.64,1),box-shadow .15s,opacity .3s;position:relative;color:#fff}
.ac:active{transform:scale(.92);box-shadow:0 1px 0 rgba(0,0,0,.12)}
.ac.a0{background:var(--bl);box-shadow:0 4px 0 var(--bd)}.ac.a1{background:var(--or);box-shadow:0 4px 0 var(--od)}.ac.a2{background:var(--pu);box-shadow:0 4px 0 var(--pd)}
.ac.wf{animation:cs2 .4s ease;filter:brightness(.7)}
.ac.mt{background:var(--gr)!important;box-shadow:0 4px 0 var(--gd)!important;pointer-events:none;animation:cm .5s ease forwards}
.ac.hd{opacity:0;transform:scale(.8);pointer-events:none}
.av{font-size:26px;font-weight:900;font-family:'Fredoka One','PingFang SC',cursive;letter-spacing:1px}
.al{font-size:10px;opacity:.85;font-weight:600;margin-top:2px}
.et{position:fixed;top:30%;left:50%;transform:translate(-50%,-50%);z-index:100;font-size:22px;font-weight:900;color:var(--gr);pointer-events:none;opacity:0;transition:all .3s;text-shadow:0 2px 8px rgba(88,204,2,.3)}
.et.sh{opacity:1;animation:tp .8s cubic-bezier(.34,1.56,.64,1) forwards}
@keyframes tp{0%{transform:translate(-50%,-50%) scale(.5);opacity:0}60%{transform:translate(-50%,-50%) scale(1.15);opacity:1}100%{transform:translate(-50%,-70%) scale(1);opacity:0}}
.mo{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:1000;display:none;align-items:center;justify-content:center}
.mo.sh{display:flex}
.cm2{background:#fff;border-radius:28px;padding:32px 24px;text-align:center;max-width:340px;width:90%;box-shadow:0 16px 48px rgba(0,0,0,.2);position:relative;animation:mi .5s cubic-bezier(.34,1.56,.64,1)}
@keyframes mi{0%{transform:scale(.5);opacity:0}100%{transform:scale(1);opacity:1}}
.ce2{font-size:80px;animation:cb2 .6s ease infinite alternate;display:inline-block}
.ce2.op{animation:co .4s ease forwards}
@keyframes cb2{0%{transform:translateY(0) scale(1)}100%{transform:translateY(-8px) scale(1.05)}}
@keyframes co{0%{transform:scale(1)}50%{transform:scale(1.3) rotate(10deg)}100%{transform:scale(1)}}
.ct2{font-size:24px;font-weight:900;color:var(--tx);margin:12px 0 4px}
.csub{font-size:14px;color:var(--tl);font-weight:600;margin-bottom:16px}
.cbtns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.cbtn{display:inline-block;padding:14px 28px;background:var(--go);color:#7C5510;border:none;border-radius:50px;font-size:16px;font-weight:800;cursor:pointer;box-shadow:0 4px 0 #D4A000;transition:transform .15s}
.cbtn:active{transform:scale(.95);box-shadow:0 1px 0 #D4A000}
.cbtn2{display:inline-block;padding:14px 28px;background:var(--gr);color:#fff;border:none;border-radius:50px;font-size:16px;font-weight:800;cursor:pointer;box-shadow:0 4px 0 var(--gd);transition:transform .15s}
.cbtn2:active{transform:scale(.95);box-shadow:0 1px 0 var(--gd)}
.co2{position:fixed;inset:0;background:var(--bg);z-index:2000;display:none;flex-direction:column;align-items:center;justify-content:center;padding:20px}
.co2.sh{display:flex}
.cert{background:#fff;border-radius:24px;padding:28px 20px 24px;text-align:center;max-width:380px;width:100%;box-shadow:0 8px 32px rgba(0,0,0,.1);position:relative;border:3px solid var(--go)}
.crb{position:absolute;top:-14px;left:50%;transform:translateX(-50%);background:var(--go);color:#7C5510;padding:4px 20px;border-radius:50px;font-size:11px;font-weight:800;white-space:nowrap}
.cstar{font-size:60px;display:block;margin-bottom:8px}
.certt{font-size:22px;font-weight:900;color:var(--tx);margin-bottom:4px}
.certsub{font-size:12px;color:var(--tl);font-weight:600;margin-bottom:16px}
.cstat{display:flex;justify-content:center;gap:20px;margin-bottom:20px}
.csi{text-align:center}.cv{font-size:28px;font-weight:900;font-family:'Fredoka One',cursive;color:var(--gr)}.cl2{font-size:11px;color:var(--tl);font-weight:600}
.cbeat{background:linear-gradient(135deg,#FFF3CD,#FFE69C);border-radius:16px;padding:14px;margin-bottom:20px;font-size:18px;font-weight:900;color:#7C5510}
.cbeat big{font-size:28px;display:block}
.cinp{width:100%;padding:12px 16px;border-radius:50px;border:2.5px solid #E5E0D5;font-size:16px;text-align:center;font-weight:700;color:var(--tx);outline:none;margin-bottom:12px;transition:border-color .2s}
.cinp:focus{border-color:var(--gr)}
.csbtn{display:block;width:100%;padding:14px;background:var(--gr);color:#fff;border:none;border-radius:50px;font-size:18px;font-weight:800;cursor:pointer;box-shadow:0 4px 0 var(--gd);transition:transform .15s}
.csbtn:active{transform:scale(.96);box-shadow:0 1px 0 var(--gd)}
.crest{display:block;width:100%;padding:10px;margin-top:8px;background:transparent;color:var(--tl);border:none;font-size:14px;font-weight:600;cursor:pointer}
.gf{text-align:center;padding:16px 0 8px;font-size:10px;color:#C0B8A8;font-weight:600}
@media(max-width:380px){.cc{padding:12px 8px}.ce{font-size:15px}.av{font-size:22px}.cr{gap:6px}}
</style>

<body>
<canvas id="pc"></canvas>
<div class="et" id="et"></div>
<div class="gw" id="gw">

  <div class="cm2">

      <div class="csi"><div class="cv" id="csco">0</div><div class="cl2">答对题数</div></div>

</div>
<script>
// ── 题目生成引擎 ──
function ri(a,b){return Math.floor(Math.random()*(b-a+1))+a}
function pk(a){return a[Math.floor(Math.random()*a.length)]}

var M25 = {
  easy:   [4,8,12,16,20],
  medium: [24,28,32,36,40],
  hard:   [44,48,52,56,60]
};
var M125 = {
  easy:   [8,16,24,32],
  medium: [40,48,56,64],
  hard:   [72,80,88,96]
};

function gen25(level){
  var pool = level <= 2 ? M25.easy : level <= 5 ? M25.medium : M25.hard;
  var n = pk(pool);
  return {
    expr: '25 × ' + n,
    hint: '25×4×' + (n/4),
    answer: String(25 * n),
    icon: '📐'
  };
}

function gen125(level){
  var pool = level <= 3 ? M125.easy : level <= 6 ? M125.medium : M125.hard;
  var n = pk(pool);
  return {
    expr: '125 × ' + n,
    hint: '125×8×' + (n/8),
    answer: String(125 * n),
    icon: '🧮'
  };
}

function genCompound(level){
  var base = pk([25, 125]);
  var a = base === 25 ? pk([4,8]) : pk([8,4]);
  var bMax = level <= 6 ? 7 : 12;
  var b = ri(2, bMax);
  var expr = a + ' × ' + b + ' × ' + base;
  var step1 = a + '×' + base + '=' + (a*base);
  var hint = step1 + ', ' + (a*base) + '×' + b + '=' + (a*base*b);
  return {
    expr: expr,
    hint: hint,
    answer: String(a * b * base),
    icon: '💡'
  };
}

function genRound(level){
  var pairs = [];
  var used = {};

  for (var i = 0; i < 3; i++) {
    var q, attempts = 0;
    do {
      var r = Math.random();
      if (level <= 2) {
        q = r < 0.7 ? gen25(level) : gen125(level);
      } else if (level <= 4) {
        q = r < 0.4 ? gen25(level) : r < 0.8 ? gen125(level) : genCompound(level);
      } else if (level <= 6) {
        q = r < 0.3 ? gen125(level) : r < 0.7 ? genCompound(level) : gen25(level + 2);
      } else if (level <= 8) {
        q = r < 0.5 ? genCompound(level) : r < 0.75 ? gen25(level) : gen125(level);
      } else {
        q = r < 0.6 ? genCompound(level) : r < 0.8 ? gen125(level) : gen25(level);
      }
      attempts++;
    } while (used[q.answer] && attempts < 20);
    used[q.answer] = true;
    pairs.push(q);
  }

  var bonusText = level >= 10 ? '  (无尽模式)' : '';
  return {
    name: '第 ' + (level + 1) + ' / 10 关' + bonusText,
    pairs: pairs
  };
}

// ── 游戏状态 ──
var MAX_ROUNDS = 10;
var currentRound = 0;
var matchedInRound = 0;
var totalScore = 0;
var maxCombo = 0;
var currentCombo = 0;
var selectedCalc = null;
var gameStartTime = 0;
var gameEndTime = 0;
var isLocked = false;
var isBonusMode = false;
var bonusRounds = 0;

// ── DOM ──
var calcRow = document.getElementById('cr');
var answerRow = document.getElementById('ar');
var scoreDisplay = document.getElementById('sd');
var scoreMaxDisplay = document.getElementById('sdmax');
var progressFill = document.getElementById('pf');
var progressText = document.getElementById('pt');
var progressStars = document.getElementById('ps2');
var roundBadge = document.getElementById('rb');
var mascot = document.getElementById('mc');
var toast = document.getElementById('et');

// ── Canvas 粒子 ──
var canvas = document.getElementById('pc');
var ctx = canvas.getContext('2d');
var particles = [];
function resizeCanvas(){canvas.width = window.innerWidth; canvas.height = window.innerHeight}
window.addEventListener('resize', resizeCanvas); resizeCanvas();

function spawnParticles(x, y, count, color){
  for (var i = 0; i < count; i++) {
    var a = Math.random() * Math.PI * 2;
    var s = 80 + Math.random() * 280;
    particles.push({
      x: x, y: y,
      vx: Math.cos(a) * s,
      vy: Math.sin(a) * s - 60,
      life: 1,
      decay: 1.2 + Math.random() * 1.8,
      color: color,
      size: 4 + Math.random() * 8,
      shape: Math.random() > 0.5 ? 'c' : 'r'
    });
  }
}

function spawnBurst(){
  var cx = window.innerWidth / 2, cy = window.innerHeight / 2;
  var colors = ['#FFC800','#FFD700','#FFAA00','#FF8800','#58CC02','#1CB0F6','#CE82FF','#FF4B4B'];
  for (var i = 0; i < 120; i++) {
    var a = Math.random() * Math.PI * 2, s = 150 + Math.random() * 400;
    particles.push({
      x: cx, y: cy,
      vx: Math.cos(a) * s,
      vy: Math.sin(a) * s - 100,
      life: 1,
      decay: 0.6 + Math.random() * 1.2,
      color: colors[Math.floor(Math.random() * colors.length)],
      size: 5 + Math.random() * 12,
      shape: 'c'
    });
  }
}

function animateParticles(){
  if (!particles.length) { requestAnimationFrame(animateParticles); return; }
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  var dt = Math.min(0.05, 16 / 1000);
  for (var i = particles.length - 1; i >= 0; i--) {
    var p = particles[i];
    p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 320 * dt;
    p.life -= p.decay * dt;
    if (p.life <= 0) { particles.splice(i, 1); continue; }
    ctx.save(); ctx.globalAlpha = p.life; ctx.fillStyle = p.color;
    if (p.shape === 'c') {
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2); ctx.fill();
    } else {
      ctx.translate(p.x, p.y); ctx.rotate(p.life * 4);
      ctx.fillRect(-p.size/2 * p.life, -p.size/2 * p.life, p.size * p.life, p.size * p.life);
    }
    ctx.restore();
  }
  requestAnimationFrame(animateParticles);
}
requestAnimationFrame(animateParticles);

// ── 工具函数 ──
function shuffle(arr){
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

function cardCenter(el){
  var r = el.getBoundingClientRect();
  return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
}

function showToast(text){
  toast.textContent = text;
  toast.classList.add('sh');
  setTimeout(function(){ toast.classList.remove('sh'); }, 800);
}

function mascotReact(emoji){
  mascot.textContent = emoji;
  mascot.classList.add('bn');
  setTimeout(function(){ mascot.classList.remove('bn'); }, 500);
}

// ── 渲染 ──
function buildCalcCardDOM(pair){
  var icon = document.createElement('div'); icon.className = 'ci'; icon.textContent = pair.icon;
  var expr = document.createElement('div'); expr.className = 'ce'; expr.textContent = pair.expr;
  var hint = document.createElement('div'); hint.className = 'ch'; hint.textContent = pair.hint;
  return [icon, expr, hint];
}

function buildAnswerCardDOM(pair){
  var val = document.createElement('div'); val.className = 'av'; val.textContent = pair.answer;
  var lbl = document.createElement('div'); lbl.className = 'al'; lbl.textContent = '答案';
  return [val, lbl];
}

function renderRound(){
  var roundData = genRound(currentRound);
  var pairs = roundData.pairs;
  var shuffledAnswers = shuffle(pairs);

  roundBadge.textContent = roundData.name;

  // 算式卡
  calcRow.textContent = '';
  pairs.forEach(function(pair){
    var card = document.createElement('div');
    card.className = 'cc';
    card.setAttribute('data-answer', pair.answer);
    var children = buildCalcCardDOM(pair);
    for (var i = 0; i < children.length; i++) card.appendChild(children[i]);
    card.addEventListener('click', function(){ onCalcClick(card); });
    calcRow.appendChild(card);
  });

  // 答案卡
  answerRow.textContent = '';
  shuffledAnswers.forEach(function(pair, idx){
    var card = document.createElement('div');
    card.className = 'ac a' + idx;
    card.setAttribute('data-answer', pair.answer);
    var children = buildAnswerCardDOM(pair);
    for (var i = 0; i < children.length; i++) card.appendChild(children[i]);
    card.addEventListener('click', function(){ onAnswerClick(card); });
    answerRow.appendChild(card);
  });

  matchedInRound = 0;
  selectedCalc = null;
  isLocked = false;
}

// ── 点击处理 ──
function onCalcClick(card){
  if (isLocked) return;
  if (card.classList.contains('mt') || card.classList.contains('hd')) return;
  var prev = calcRow.querySelector('.cc.sel');
  if (prev) prev.classList.remove('sel');
  card.classList.add('sel');
  selectedCalc = card;
}

function onAnswerClick(card){
  if (isLocked) return;
  if (card.classList.contains('mt') || card.classList.contains('hd')) return;
  if (!selectedCalc) { showToast('先点一张算式卡哦~'); return; }
  var calcAns = selectedCalc.getAttribute('data-answer');
  var cardAns = card.getAttribute('data-answer');
  if (calcAns === cardAns) { handleCorrect(selectedCalc, card); }
  else { handleWrong(selectedCalc, card); }
}

// ── 正确匹配 ──
function handleCorrect(calcCard, ansCard){
  isLocked = true;
  currentCombo++; totalScore++;
  if (currentCombo > maxCombo) maxCombo = currentCombo;
  matchedInRound++;

  calcCard.classList.remove('sel');
  calcCard.classList.add('mt');
  ansCard.classList.add('mt');

  var cp = cardCenter(calcCard), ap = cardCenter(ansCard);
  spawnParticles(cp.x, cp.y, 18, '#58CC02');
  spawnParticles(ap.x, ap.y, 18, '#FFC800');

  var msgs = ['太棒了!🌟','凑整成功!✨','完美匹配!🎯','算得真快!⚡','继续加油!💪'];
  showToast(msgs[Math.floor(Math.random() * msgs.length)]);
  mascotReact('😍');

  // 进度更新
  var progressMax = MAX_ROUNDS * 3;
  progressFill.style.width = (totalScore / progressMax * 100) + '%';
  progressText.textContent = totalScore + ' 题正确';
  var starCount = Math.min(5, Math.floor(totalScore / (progressMax / 5)));
  var starStr = '';
  for (var s = 0; s < 5; s++) starStr += s < starCount ? '★' : '☆';
  progressStars.textContent = starStr;
  scoreDisplay.textContent = totalScore;

  setTimeout(function(){
    calcCard.classList.add('hd');
    ansCard.classList.add('hd');
    selectedCalc = null;
    isLocked = false;
    if (matchedInRound >= 3) {
      setTimeout(function(){ roundComplete(); }, 350);
    }
  }, 420);
}

// ── 错误匹配 ──
function handleWrong(calcCard, ansCard){
  isLocked = true;
  currentCombo = 0;
  calcCard.classList.remove('sel');
  calcCard.classList.add('wf');
  ansCard.classList.add('wf');
  showToast('再想想~ 🤔');
  mascotReact('😅');
  setTimeout(function(){
    calcCard.classList.remove('wf'); ansCard.classList.remove('wf');
    selectedCalc = null; isLocked = false;
  }, 400);
}

// ── 通关逻辑 ──
function roundComplete(){
  currentRound++;
  if (currentRound >= MAX_ROUNDS && !isBonusMode) {
    gameEndTime = Date.now();
    showTreasureChest();
  } else {
    var msg = isBonusMode ? ('无尽第' + (bonusRounds + 1) + '轮! 🔥') : '通关!进入下一关 🚀';
    showToast(msg);
    mascotReact('🤩');
    if (isBonusMode) bonusRounds++;
    setTimeout(function(){ renderRound(); }, 500);
  }
}

function showTreasureChest(){
  document.getElementById('chm').classList.add('sh');
  document.getElementById('chmt').textContent = '太厉害了!';
  document.getElementById('chms').textContent = '10关全部通关! ' + totalScore + ' 题正确';
  progressFill.style.width = '100%';
  progressText.textContent = '全部完成!';
  progressStars.textContent = '★★★★★';

  document.getElementById('chbtn2').onclick = openCertificate;
  document.getElementById('chbtn3').onclick = continueChallenge;

  setTimeout(function(){
    var ce = document.getElementById('che');
    ce.textContent = '💰';
    ce.classList.add('op');
    spawnBurst();
  }, 600);
}

function continueChallenge(){
  document.getElementById('chm').classList.remove('sh');
  isBonusMode = true;
  bonusRounds = 0;
  currentRound = MAX_ROUNDS;
  showToast('无尽模式! 🔥');
  mascotReact('🚀');
  renderRound();
}

function openCertificate(){
  document.getElementById('chm').classList.remove('sh');
  var elapsed = Math.round((gameEndTime - gameStartTime) / 1000);
  document.getElementById('csco').textContent = totalScore;
  document.getElementById('ccb').textContent = maxCombo;
  document.getElementById('ctm').textContent = elapsed + 's';
  var beatPercent = 88 + Math.floor(Math.random() * 11);
  document.getElementById('cbe').textContent = beatPercent + '%';
  if (isBonusMode) {
    document.getElementById('certt').textContent = '凑整法全能王';
  }
  document.getElementById('co2').classList.add('sh');
  spawnBurst();
  setTimeout(function(){ spawnBurst(); }, 800);
}

document.getElementById('csb').addEventListener('click', function(){
  var name = document.getElementById('cni').value.trim();
  if (!name) name = '同学';
  showToast('证书已保存,' + name + '!🎓');
  mascotReact('🎓');
});

document.getElementById('crs').addEventListener('click', restartGame);

function restartGame(){
  document.getElementById('co2').classList.remove('sh');
  document.getElementById('certt').textContent = '简便运算大师';
  currentRound = 0;
  totalScore = 0;
  maxCombo = 0;
  currentCombo = 0;
  selectedCalc = null;
  isLocked = false;
  isBonusMode = false;
  bonusRounds = 0;
  gameStartTime = Date.now();
  scoreDisplay.textContent = '0';
  progressFill.style.width = '0%';
  progressText.textContent = '开始挑战!';
  progressStars.textContent = '☆☆☆☆☆';
  gameEndTime = 0;
  renderRound();
}

// ── 启动 ──
gameStartTime = Date.now();
renderRound();
</script>
</body>
</html>
