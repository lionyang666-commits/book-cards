<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, user-scalable=no">
<title>凑整法消消乐 - 小升初简便运算</title>
<style>
:root {
  --bg:      #FFF8E7;
  --green:   #58CC02;
  --green-d: #46A302;
  --blue:    #1CB0F6;
  --blue-d:  #1899D6;
  --orange:  #FF9600;
  --orange-d:#E08500;
  --purple:  #CE82FF;
  --purple-d:#A568CC;
  --red:     #FF4B4B;
  --gold:    #FFC800;
  --text:    #4B4B4B;
  --text-l:  #777;
  --card-shadow: 0 4px 0 rgba(0,0,0,0.12);
  --card-radius: 18px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;min-height:100%;overflow-x:hidden}
body{font-family:'PingFang SC','Microsoft YaHei','Helvetica Neue',sans-serif;background:var(--bg);display:flex;flex-direction:column;align-items:center;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
#pc{position:fixed;inset:0;z-index:999;pointer-events:none}
.gw{width:100%;max-width:460px;padding:12px 16px 24px;display:flex;flex-direction:column;min-height:100vh;position:relative;z-index:1}
.gh{display:flex;align-items:center;gap:10px;padding:8px 0 6px}
.mc{width:48px;height:48px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:28px;flex-shrink:0;box-shadow:0 2px 8px rgba(0,0,0,.08);transition:transform .3s}
.mc.bn{animation:mb .5s}
@keyframes mb{0%,100%{transform:translateY(0)}40%{transform:translateY(-14px)}60%{transform:translateY(-6px)}}
.hi{flex:1}
.ht{font-size:18px;font-weight:800;color:var(--text);line-height:1.2}
.hs{font-size:11px;color:var(--text-l);font-weight:600}
.sp{background:#fff;border-radius:50px;padding:8px 14px;font-size:14px;font-weight:800;color:var(--green);white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,.06);display:flex;align-items:center;gap:4px}
.ps{padding:10px 0 6px}
.pbw{background:#E5E0D5;border-radius:50px;height:14px;overflow:hidden;position:relative}
.pbf{height:100%;border-radius:50px;background:linear-gradient(90deg,var(--green),#7CE82A);transition:width .6s cubic-bezier(.4,0,.2,1);position:relative}
.pbf::after{content:'';position:absolute;top:2px;left:6px;right:6px;height:4px;border-radius:2px;background:rgba(255,255,255,.35)}
.pl{display:flex;justify-content:space-between;font-size:10px;color:var(--text-l);font-weight:700;margin-top:4px}
.pstar{font-size:12px;letter-spacing:2px}
.rb{text-align:center;padding:8px 0 4px;font-size:12px;font-weight:800;color:var(--text-l);letter-spacing:.5px}
.rb span{display:inline-block;padding:3px 12px;background:#fff;border-radius:50px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.cs{display:flex;flex-direction:column;gap:16px;margin-top:8px;flex:1}
.sl{font-size:11px;font-weight:700;color:var(--text-l);text-align:center;letter-spacing:1px}
.cr{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.cc{flex:1;min-width:100px;max-width:140px;background:#fff;border-radius:var(--card-radius);padding:16px 10px;text-align:center;cursor:pointer;box-shadow:var(--card-shadow);border:3px solid transparent;transition:transform .15s cubic-bezier(.34,1.56,.64,1),box-shadow .15s,border-color .15s;position:relative}
.cc:active{transform:scale(.92);box-shadow:0 1px 0 rgba(0,0,0,.12)}
.cc.sel{border-color:var(--blue);box-shadow:0 0 0 4px rgba(28,176,246,.25),var(--card-shadow);transform:scale(1.04)}
.cc.mt{border-color:var(--green);background:#F0FFE0;pointer-events:none;animation:cm .5s ease forwards}
.cc.wf{border-color:var(--red);animation:cs2 .4s ease}
.cc.hd{opacity:0;transform:scale(.8);pointer-events:none}
.ci{font-size:22px;margin-bottom:4px}
.ce{font-size:17px;font-weight:800;color:var(--text);letter-spacing:.5px;line-height:1.3}
.ch{font-size:10px;color:var(--text-l);font-weight:600;margin-top:3px}
@keyframes cm{0%{transform:scale(1.04)}50%{transform:scale(1.12)}100%{transform:scale(1);opacity:.6}}
@keyframes cs2{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.ac{flex:1;min-width:100px;max-width:140px;border-radius:var(--card-radius);padding:18px 10px;text-align:center;cursor:pointer;box-shadow:var(--card-shadow);border:none;transition:transform .15s cubic-bezier(.34,1.56,.64,1),box-shadow .15s,opacity .3s;position:relative;color:#fff}
.ac:active{transform:scale(.92);box-shadow:0 1px 0 rgba(0,0,0,.12)}
.ac.a0{background:var(--blue);box-shadow:0 4px 0 var(--blue-d)}
.ac.a1{background:var(--orange);box-shadow:0 4px 0 var(--orange-d)}
.ac.a2{background:var(--purple);box-shadow:0 4px 0 var(--purple-d)}
.ac.wf{animation:cs2 .4s ease;filter:brightness(.7)}
.ac.mt{background:var(--green)!important;box-shadow:0 4px 0 var(--green-d)!important;pointer-events:none;animation:cm .5s ease forwards}
.ac.hd{opacity:0;transform:scale(.8);pointer-events:none}
.av{font-size:26px;font-weight:900;font-family:'Fredoka One','PingFang SC',cursive;letter-spacing:1px}
.al{font-size:10px;opacity:.85;font-weight:600;margin-top:2px}
.et{position:fixed;top:30%;left:50%;transform:translate(-50%,-50%);z-index:100;font-size:22px;font-weight:900;color:var(--green);pointer-events:none;opacity:0;transition:all .3s;text-shadow:0 2px 8px rgba(88,204,2,.3)}
.et.sh{opacity:1;animation:tp .8s cubic-bezier(.34,1.56,.64,1) forwards}
@keyframes tp{0%{transform:translate(-50%,-50%) scale(.5);opacity:0}60%{transform:translate(-50%,-50%) scale(1.15);opacity:1}100%{transform:translate(-50%,-70%) scale(1);opacity:0}}
.mo{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:1000;display:none;align-items:center;justify-content:center}
.mo.sh{display:flex}
.cm2{background:#fff;border-radius:28px;padding:32px 24px;text-align:center;max-width:340px;width:90%;box-shadow:0 16px 48px rgba(0,0,0,.2);position:relative;animation:mi .5s cubic-bezier(.34,1.56,.64,1)}
@keyframes mi{0%{transform:scale(.5);opacity:0}100%{transform:scale(1);opacity:1}}
.ce2{font-size:80px;animation:cb2 .6s ease infinite alternate;display:inline-block}
.ce2.op{animation:co .4s ease forwards}
@keyframes cb2{0%{transform:translateY(0) scale(1)}100%{transform:translateY(-8px) scale(1.05)}}
@keyframes co{0%{transform:scale(1)}50%{transform:scale(1.3) rotate(10deg)}100%{transform:scale(1)}}
.ct2{font-size:24px;font-weight:900;color:var(--text);margin:12px 0 4px}
.csub{font-size:14px;color:var(--text-l);font-weight:600;margin-bottom:16px}
.cbtn{display:inline-block;padding:14px 40px;background:var(--gold);color:#7C5510;border:none;border-radius:50px;font-size:18px;font-weight:800;cursor:pointer;box-shadow:0 4px 0 #D4A000;transition:transform .15s}
.cbtn:active{transform:scale(.95);box-shadow:0 1px 0 #D4A000}
.co2{position:fixed;inset:0;background:var(--bg);z-index:2000;display:none;flex-direction:column;align-items:center;justify-content:center;padding:20px}
.co2.sh{display:flex}
.cert{background:#fff;border-radius:24px;padding:28px 20px 24px;text-align:center;max-width:380px;width:100%;box-shadow:0 8px 32px rgba(0,0,0,.1);position:relative;border:3px solid var(--gold)}
.crb{position:absolute;top:-14px;left:50%;transform:translateX(-50%);background:var(--gold);color:#7C5510;padding:4px 20px;border-radius:50px;font-size:11px;font-weight:800;white-space:nowrap}
.cstar{font-size:60px;display:block;margin-bottom:8px}
.certt{font-size:22px;font-weight:900;color:var(--text);margin-bottom:4px}
.certsub{font-size:12px;color:var(--text-l);font-weight:600;margin-bottom:16px}
.cstat{display:flex;justify-content:center;gap:20px;margin-bottom:20px}
.csi{text-align:center}
.cv{font-size:28px;font-weight:900;font-family:'Fredoka One',cursive;color:var(--green)}
.cl2{font-size:11px;color:var(--text-l);font-weight:600}
.cbeat{background:linear-gradient(135deg,#FFF3CD,#FFE69C);border-radius:16px;padding:14px;margin-bottom:20px;font-size:18px;font-weight:900;color:#7C5510}
.cbeat big{font-size:28px;display:block}
.cinp{width:100%;padding:12px 16px;border-radius:50px;border:2.5px solid #E5E0D5;font-size:16px;text-align:center;font-weight:700;color:var(--text);outline:none;margin-bottom:12px;transition:border-color .2s}
.cinp:focus{border-color:var(--green)}
.csbtn{display:block;width:100%;padding:14px;background:var(--green);color:#fff;border:none;border-radius:50px;font-size:18px;font-weight:800;cursor:pointer;box-shadow:0 4px 0 var(--green-d);transition:transform .15s}
.csbtn:active{transform:scale(.96);box-shadow:0 1px 0 var(--green-d)}
.crest{display:block;width:100%;padding:10px;margin-top:8px;background:transparent;color:var(--text-l);border:none;font-size:14px;font-weight:600;cursor:pointer}
.gf{text-align:center;padding:16px 0 8px;font-size:10px;color:#C0B8A8;font-weight:600}
@media(max-width:380px){.cc{padding:12px 8px}.ce{font-size:15px}.av{font-size:22px}.cr{gap:6px}}
</style>
</head>
<body>
<canvas id="pc"></canvas>
<div class="et" id="et"></div>
<div class="gw" id="gw">
  <div class="gh">
    <div class="mc" id="mc">&#x1F989;</div>
    <div class="hi"><div class="ht">凑整法消消乐</div><div class="hs">小升初 &middot; 简便运算专项</div></div>
    <div class="sp">&#x2B50; <span id="sd">0</span></div>
  </div>
  <div class="ps">
    <div class="pbw"><div class="pbf" id="pf" style="width:0%"></div></div>
    <div class="pl"><span id="pt">开始挑战!</span><span class="pstar" id="ps2">&#x2606;&#x2606;&#x2606;&#x2606;&#x2606;</span></div>
  </div>
  <div class="rb"><span id="rb">第 1 / 5 关</span></div>
  <div class="cs">
    <div class="sl">&#x1F447; 点击一张算式卡</div>
    <div class="cr" id="cr"></div>
    <div style="height:4px"></div>
    <div class="sl">&#x1F446; 再点对应的答案</div>
    <div class="cr" id="ar"></div>
  </div>
  <div class="gf">凑整法 &middot; 小升初简便运算 &middot; 消消乐挑战</div>
</div>
<div class="mo" id="chm">
  <div class="cm2">
    <div class="ce2" id="che">&#x1F381;</div>
    <div class="ct2">太厉害了!</div>
    <div class="csub">你完成了全部挑战!</div>
    <button class="cbtn" id="chbtn">开启宝箱 &#x1F389;</button>
  </div>
</div>
<div class="co2" id="co2">
  <div class="cert">
    <div class="crb">&#x1F3C6; 荣誉证书</div>
    <span class="cstar">&#x1F31F;</span>
    <div class="certt">简便运算大师</div>
    <div class="certsub">小升初 &middot; 凑整法专项训练</div>
    <div class="cstat">
      <div class="csi"><div class="cv" id="csco">0</div><div class="cl2">答对题数</div></div>
      <div class="csi"><div class="cv" id="ccb">0</div><div class="cl2">最高连击</div></div>
      <div class="csi"><div class="cv" id="ctm">0s</div><div class="cl2">用时</div></div>
    </div>
    <div class="cbeat">击败了 <big id="cbe">98%</big> 同龄人</div>
    <input class="cinp" id="cni" placeholder="输入你的名字" maxlength="12">
    <button class="csbtn" id="csb">&#x1F4F8; 保存荣誉证书</button>
    <button class="crest" id="crs">再玩一次</button>
  </div>
</div>
<script>
var ROUNDS=[{name:'第 1 / 5 关',pairs:[{expr:'25 × 12',hint:'25×4×3',answer:'300',icon:'📐'},{expr:'125 × 8',hint:'125×8=1000',answer:'1000',icon:'🧮'},{expr:'4 × 7 × 25',hint:'4×25×7',answer:'700',icon:'✖️'}]},{name:'第 2 / 5 关',pairs:[{expr:'32 × 25',hint:'8×4×25',answer:'800',icon:'🔢'},{expr:'125 × 16',hint:'125×8×2',answer:'2000',icon:'📏'},{expr:'5 × 12 × 5',hint:'5×5×12',answer:'300',icon:'🎯'}]},{name:'第 3 / 5 关',pairs:[{expr:'25 × 36',hint:'25×4×9',answer:'900',icon:'💡'},{expr:'125 × 24',hint:'125×8×3',answer:'3000',icon:'⚡'},{expr:'15 × 12',hint:'15×2×6',answer:'180',icon:'🔑'}]},{name:'第 4 / 5 关',pairs:[{expr:'125 × 32',hint:'125×8×4',answer:'4000',icon:'🚀'},{expr:'25 × 44',hint:'25×4×11',answer:'1100',icon:'🎪'},{expr:'8 × 12 × 5',hint:'8×5×12',answer:'480',icon:'🎲'}]},{name:'第 5 / 5 关',pairs:[{expr:'25 × 28',hint:'25×4×7',answer:'700',icon:'🏅'},{expr:'125 × 48',hint:'125×8×6',answer:'6000',icon:'👑'},{expr:'16 × 25 × 3',hint:'4×25×4×3',answer:'1200',icon:'💎'}]}];
var cr=0,mr=0,ts=0,mx=0,ccb=0,sc=null,st=0,et2=0,lk=false;
var cR=document.getElementById('cr'),aR=document.getElementById('ar'),sd=document.getElementById('sd'),pf=document.getElementById('pf'),pt=document.getElementById('pt'),ps2=document.getElementById('ps2'),rb=document.getElementById('rb'),mc=document.getElementById('mc'),et=document.getElementById('et');
var cv=document.getElementById('pc'),cx=cv.getContext('2d'),pts=[];
function rs(){cv.width=window.innerWidth;cv.height=window.innerHeight}
window.addEventListener('resize',rs);rs();
function sp2(x,y,n,c){for(var i=0;i<n;i++){var a=Math.random()*Math.PI*2,s=80+Math.random()*280;pts.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-60,life:1,decay:1.2+Math.random()*1.8,color:c,size:4+Math.random()*8,shape:Math.random()>.5?'c':'r'});}}
function sb(){var cx2=window.innerWidth/2,cy2=window.innerHeight/2,cs=['#FFC800','#FFD700','#FFAA00','#FF8800','#58CC02','#1CB0F6','#CE82FF','#FF4B4B'];for(var i=0;i<120;i++){var a=Math.random()*Math.PI*2,s=150+Math.random()*400;pts.push({x:cx2,y:cy2,vx:Math.cos(a)*s,vy:Math.sin(a)*s-100,life:1,decay:.6+Math.random()*1.2,color:cs[Math.floor(Math.random()*cs.length)],size:5+Math.random()*12,shape:'c'});}}
function ap(){if(!pts.length){requestAnimationFrame(ap);return}cx.clearRect(0,0,cv.width,cv.height);var dt=Math.min(.05,16/1000);for(var i=pts.length-1;i>=0;i--){var p=pts[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=320*dt;p.life-=p.decay*dt;if(p.life<=0){pts.splice(i,1);continue}cx.save();cx.globalAlpha=p.life;cx.fillStyle=p.color;if(p.shape==='c'){cx.beginPath();cx.arc(p.x,p.y,p.size*p.life,0,Math.PI*2);cx.fill()}else{cx.translate(p.x,p.y);cx.rotate(p.life*4);cx.fillRect(-p.size/2*p.life,-p.size/2*p.life,p.size*p.life,p.size*p.life)}cx.restore()}requestAnimationFrame(ap)}
requestAnimationFrame(ap);
function shf(a){var r=a.slice();for(var i=r.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=r[i];r[i]=r[j];r[j]=t}return r}
function gcc(e){var r=e.getBoundingClientRect();return{x:r.left+r.width/2,y:r.top+r.height/2}}
function st2(t){et.textContent=t;et.classList.add('sh');setTimeout(function(){et.classList.remove('sh')},800)}
function mr2(e){mc.textContent=e;mc.classList.add('bn');setTimeout(function(){mc.classList.remove('bn')},500)}
function bc(p){var d=document.createElement('div');d.className='ci';d.textContent=p.icon;var e=document.createElement('div');e.className='ce';e.textContent=p.expr;var h=document.createElement('div');h.className='ch';h.textContent=p.hint;return[d,e,h]}
function ba(p){var v=document.createElement('div');v.className='av';v.textContent=p.answer;var l=document.createElement('div');l.className='al';l.textContent='答案';return[v,l]}
function rr(){var round=ROUNDS[cr],pairs=round.pairs,shuffled=shf(pairs);rb.textContent=round.name;cR.textContent='';pairs.forEach(function(p,i){var card=document.createElement('div');card.className='cc';card.setAttribute('data-answer',p.answer);var kids=bc(p);for(var k=0;k<kids.length;k++)card.appendChild(kids[k]);card.addEventListener('click',function(){oc(card)});cR.appendChild(card)});aR.textContent='';shuffled.forEach(function(p,i){var card=document.createElement('div');card.className='ac a'+i;card.setAttribute('data-answer',p.answer);var kids=ba(p);for(var k=0;k<kids.length;k++)card.appendChild(kids[k]);card.addEventListener('click',function(){oa(card)});aR.appendChild(card)});mr=0;sc=null;lk=false}
function oc(card){if(lk)return;if(card.classList.contains('mt')||card.classList.contains('hd'))return;var prev=cR.querySelector('.cc.sel');if(prev)prev.classList.remove('sel');card.classList.add('sel');sc=card}
function oa(card){if(lk)return;if(card.classList.contains('mt')||card.classList.contains('hd'))return;if(!sc){st2('先点一张算式卡哦~');return}var ca=sc.getAttribute('data-answer'),aa=card.getAttribute('data-answer');if(ca===aa){hc(sc,card)}else{hw(sc,card)}}
function hc(cc2,ac2){lk=true;ccb++;ts++;if(ccb>mx)mx=ccb;mr++;cc2.classList.remove('sel');cc2.classList.add('mt');ac2.classList.add('mt');var cp=gcc(cc2),ap2=gcc(ac2);sp2(cp.x,cp.y,18,'#58CC02');sp2(ap2.x,ap2.y,18,'#FFC800');var ms=['太棒了!🌟','凑整成功!✨','完美匹配!🎯','算得真快!⚡','继续加油!💪'];st2(ms[Math.floor(Math.random()*ms.length)]);mr2('😍');pf.style.width=(ts/15*100)+'%';pt.textContent=ts+' 题正确';var stars=Math.min(5,Math.floor(ts/3)),ss='';for(var s=0;s<5;s++)ss+=s<stars?'★':'☆';ps2.textContent=ss;sd.textContent=ts;setTimeout(function(){cc2.classList.add('hd');ac2.classList.add('hd');sc=null;lk=false;if(mr>=3){setTimeout(function(){rc()},300)}},420)}
function hw(cc2,ac2){lk=true;ccb=0;cc2.classList.remove('sel');cc2.classList.add('wf');ac2.classList.add('wf');st2('再想想~ 🤔');mr2('😅');setTimeout(function(){cc2.classList.remove('wf');ac2.classList.remove('wf');sc=null;lk=false},400)}
function rc(){cr++;if(cr>=ROUNDS.length){et2=Date.now();sct()}else{st2('通关!进入下一关 🚀');mr2('🤩');setTimeout(function(){rr()},500)}}
function sct(){document.getElementById('chm').classList.add('sh');pf.style.width='100%';pt.textContent='全部完成!';ps2.textContent='★★★★★';document.getElementById('chbtn').addEventListener('click',oc2);setTimeout(function(){var ce=document.getElementById('che');ce.textContent='💰';ce.classList.add('op');sb()},600)}
function oc2(){document.getElementById('chm').classList.remove('sh');var el=Math.round((et2-st)/1000);document.getElementById('csco').textContent=ts;document.getElementById('ccb').textContent=mx;document.getElementById('ctm').textContent=el+'s';var bp=88+Math.floor(Math.random()*11);document.getElementById('cbe').textContent=bp+'%';document.getElementById('co2').classList.add('sh');sb();setTimeout(function(){sb()},800)}
document.getElementById('csb').addEventListener('click',function(){var n=document.getElementById('cni').value.trim();if(!n)n='同学';st2('证书已保存,'+n+'!🎓');mr2('🎓')});
document.getElementById('crs').addEventListener('click',function(){document.getElementById('co2').classList.remove('sh');cr=0;ts=0;mx=0;ccb=0;sc=null;lk=false;st=Date.now();sd.textContent='0';pf.style.width='0%';pt.textContent='开始挑战!';ps2.textContent='☆☆☆☆☆';rr()});
st=Date.now();rr();
</script>
</body>
</html>
