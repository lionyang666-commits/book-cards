<style>
  /* ============================================
     设计系统 — 暖金/琥珀色系
     参考：小红书风格卡片 UI
     ============================================ */
  :root {
    /* 主色 — 深墨绿/蓝灰 (参考《思考快与慢》配色) */
    --accent:         #4A90D9;
    --accent-rgb:     74, 144, 217;
    --accent-deep:    #1A4E8A;
    --accent-light:   #6AB0F9;

    /* 深色主题 */
    --bg-dark-start:  #0f2027;
    --bg-dark-mid:    #203a43;
    --bg-dark-end:    #2c5364;

    /* 文字 */
    --text-primary:   #1a1a1e;
    --text-body:      #555;
    --text-muted:     #999;
    --text-faint:     #bbb;

    /* 阴影 — 更轻更淡 */
    --shadow-sm:      0 1px 3px rgba(0,0,0,0.04);
    --shadow-md:      0 4px 16px rgba(0,0,0,0.05);
    --shadow-lg:      0 8px 32px rgba(0,0,0,0.06);
    --shadow-xl:      0 16px 48px rgba(0,0,0,0.08);
    --shadow-hover:   0 12px 40px rgba(0,0,0,0.10);

    /* 圆角 */
    --radius-sm:      8px;
    --radius-md:      14px;
    --radius-lg:      18px;
    --radius-xl:      24px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #f8f9fa;
    font-family: -apple-system, "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
    color: var(--text-primary);
    min-height: 100vh;
  }

  /* ============================================
     头部
     ============================================ */
  .header {
    text-align: center;
    padding: 80px 24px 56px;
    position: relative;
    background: linear-gradient(135deg, var(--bg-dark-start) 0%, var(--bg-dark-mid) 50%, var(--bg-dark-end) 100%);
    overflow: hidden;
  }
  .header::after {
    content: "";
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 48px;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
  }
  .header .tag {
    display: inline-block;
    font-size: 11px;
    color: rgba(255,255,255,0.4);
    letter-spacing: 5px;
    font-weight: 500;
    margin-bottom: 18px;
    text-transform: uppercase;
    background: rgba(255,255,255,0.06);
    padding: 4px 14px;
    border-radius: 20px;
  }
  .header h1 {
    font-size: 38px;
    font-weight: 500;
    letter-spacing: 2px;
    margin-bottom: 12px;
    color: #fff;
  }
  .header .subtitle {
    font-size: 15px;
    color: rgba(255,255,255,0.5);
    letter-spacing: 0.5px;
    font-weight: 400;
  }
  .header .count {
    margin-top: 8px;
    font-size: 13px;
    color: rgba(255,255,255,0.25);
    letter-spacing: 1px;
  }

  /* ============================================
     书籍网格
     ============================================ */
  .book-grid {
    max-width: 1200px;
    margin: 0 auto;
    padding: 44px 24px 80px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 28px;
  }

  /* ============================================
     书籍卡片 — 优化版
     特点：双层边框、多层阴影、悬浮抬升
     ============================================ */
  .book-card {
    background: #fff;
    border-radius: var(--radius-lg);
    overflow: hidden;
    cursor: pointer;
    position: relative;
    transition:
      transform 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94),
      box-shadow 0.35s ease;
    box-shadow: var(--shadow-sm), var(--shadow-md);
    border: 0.5px solid rgba(0,0,0,0.04);
    outline: none;
  }

  .book-card:hover {
    transform: translateY(-4px);
    box-shadow: var(--shadow-sm), var(--shadow-lg), var(--shadow-hover);
  }
  .book-card:focus-visible {
    box-shadow: var(--shadow-sm), var(--shadow-lg), 0 0 0 3px rgba(var(--accent-rgb), 0.3);
  }

  /* 封面缩略图 */
  .book-card .cover {
    width: 100%;
    aspect-ratio: 3 / 4;
    overflow: hidden;
    background: #e8ecf0;
    position: relative;
  }
  .book-card .cover img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: transform 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
  }
  .book-card:hover .cover img {
    transform: scale(1.04);
  }

  /* 底部信息区 */
  .book-card .info {
    padding: 16px 20px 20px;
  }
  .book-card .info .book-tag {
    display: inline-block;
    font-size: 11px;
    font-weight: 500;
    padding: 3px 10px;
    border-radius: 20px;
    background: rgba(var(--accent-rgb), 0.08);
    color: var(--accent-deep);
    letter-spacing: 0.5px;
    margin-bottom: 10px;
  }
  .book-card .info .book-title {
    font-size: 18px;
    font-weight: 600;
    color: var(--text-primary);
    margin-bottom: 2px;
    letter-spacing: 0.3px;
  }
  .book-card .info .book-author {
    font-size: 13px;
    color: var(--text-muted);
    font-weight: 400;
  }
  .book-card .info .book-meta {
    margin-top: 8px;
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 12px;
    color: var(--text-faint);
  }
  .book-card .info .book-meta .sep {
    color: var(--text-faint);
    opacity: 0.4;
  }

  /* 空状态提示 */
  .empty-state {
    grid-column: 1 / -1;
    text-align: center;
    padding: 80px 24px;
    color: var(--text-muted);
  }
  .empty-state .icon {
    font-size: 36px;
    opacity: 0.3;
    margin-bottom: 16px;
  }
  .empty-state p {
    font-size: 14px;
    line-height: 1.8;
  }

  /* ============================================
     灯箱遮罩 — 毛玻璃效果
     ============================================ */
  .gallery-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(15,20,25,0.92);
    backdrop-filter: blur(16px) saturate(0.9);
    -webkit-backdrop-filter: blur(16px) saturate(0.9);
    z-index: 1000;
    padding: 32px;
    overflow-y: auto;
    transition: background 0.4s ease;
  }
  /* 每本书的灯箱主题色 — 明显区分 */
  .gallery-overlay[data-book="huozhe"] {
    --book-accent: #C9976A;
    --book-accent-rgb: 201, 151, 106;
    background: linear-gradient(135deg, rgba(8,6,4,0.96), rgba(18,14,10,0.92));
  }
  .gallery-overlay[data-book="waldon"] {
    --book-accent: #52B788;
    --book-accent-rgb: 82, 183, 136;
    background: linear-gradient(135deg, rgba(8,30,15,0.96), rgba(10,12,12,0.92));
  }
  .gallery-overlay[data-book="bainian"] {
    --book-accent: #A06DB8;
    --book-accent-rgb: 160, 109, 184;
    background: linear-gradient(135deg, rgba(22,8,38,0.96), rgba(10,10,15,0.92));
  }
  .gallery-overlay[data-book="sikao"] {
    --book-accent: #FFD700;
    --book-accent-rgb: 255, 215, 0;
    background: linear-gradient(135deg, rgba(8,8,8,0.96), rgba(20,20,20,0.92));
  }
  .gallery-overlay[data-book="beitanyongqi"] {
    --book-accent: #7A9E9E;
    --book-accent-rgb: 122, 158, 158;
    background: linear-gradient(135deg, rgba(15,20,22,0.96), rgba(22,30,33,0.92));
  }
  .gallery-overlay[data-book="wuhezhizhong"] {
    --book-accent: #C4454E;
    --book-accent-rgb: 196, 69, 78;
    background: linear-gradient(135deg, rgba(20,8,10,0.96), rgba(25,12,15,0.92));
  }
  .gallery-overlay[data-book="yulezhisi"] {
    --book-accent: #C9A040;
    --book-accent-rgb: 201, 160, 64;
    background: linear-gradient(135deg, rgba(15,12,6,0.96), rgba(20,16,8,0.92));
  }
  .gallery-overlay[data-book="jingguanshehui"] {
    --book-accent: #93B88A;
    --book-accent-rgb: 147, 184, 138;
    background: linear-gradient(135deg, rgba(10,18,12,0.96), rgba(14,22,16,0.92));
  }
  .gallery-overlay.active {
    display: flex;
    flex-direction: column;
  }

  /* 灯箱头部 */
  .gallery-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-bottom: 20px;
    flex-shrink: 0;
    border-bottom: 0.5px solid rgba(255,255,255,0.06);
    transition: border-color 0.3s ease;
  }
  .gallery-overlay[data-book] .gallery-header {
    border-color: rgba(var(--book-accent-rgb), 0.15);
  }
  .gallery-header .gallery-title {
    color: rgba(255,255,255,0.5);
    font-size: 15px;
    letter-spacing: 1px;
    font-weight: 400;
  }
  .gallery-header .gallery-title strong {
    color: rgba(255,255,255,0.85);
    font-weight: 600;
  }
  .gallery-close {
    background: none;
    border: none;
    color: rgba(255,255,255,0.3);
    font-size: 28px;
    cursor: pointer;
    padding: 4px 8px;
    line-height: 1;
    transition: color 0.2s;
    border-radius: 6px;
    outline: none;
  }
  .gallery-close:hover {
    color: rgba(255,255,255,0.8);
    background: rgba(255,255,255,0.06);
  }
  .gallery-close:focus-visible {
    box-shadow: 0 0 0 2px rgba(255,255,255,0.4);
  }

  /* 灯箱卡片网格 */
  .gallery-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
    flex: 1;
    align-content: center;
    max-width: 1200px;
    margin: 20px auto 0;
    width: 100%;
  }
  .gallery-grid .gallery-card {
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 4px 24px rgba(0,0,0,0.25);
    transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.3s ease;
    border: 0.5px solid rgba(255,255,255,0.06);
    min-height: 200px;
    background: rgba(255,255,255,0.03);
  }
  .gallery-overlay[data-book] .gallery-card {
    border: 1px solid rgba(var(--book-accent-rgb), 0.25);
    border-radius: 12px;
  }
  .gallery-overlay[data-book] .gallery-card:hover {
    border-color: rgba(var(--book-accent-rgb), 0.5);
  }
  .gallery-grid .gallery-card:hover {
    transform: scale(1.015);
    box-shadow: 0 8px 40px rgba(0,0,0,0.35);
  }
  .gallery-overlay[data-book] .gallery-card:hover {
    border-color: rgba(var(--book-accent-rgb), 0.4);
  }
  .gallery-grid .gallery-card img {
    width: 100%;
    display: block;
    /* 默认透明，加载后渐显 */
    opacity: 0;
    transition: opacity 0.4s ease;
  }
  .gallery-grid .gallery-card img.loaded {
    opacity: 1;
  }

  /* ============================================
     底部关注区 — 二维码卡片
     ============================================ */
  .footer-follow {
    text-align: center;
    padding: 48px 24px 40px;
    position: relative;
    background: linear-gradient(180deg, rgba(var(--accent-rgb), 0.03) 0%, transparent 40%);
  }
  .footer-follow::before {
    content: "";
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 48px;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(0,0,0,0.06), transparent);
  }
  .footer-follow .heading {
    font-size: 13px;
    color: var(--text-muted);
    letter-spacing: 4px;
    font-weight: 400;
    margin-bottom: 28px;
  }
  .footer-follow .qr-row {
    display: flex;
    justify-content: center;
    gap: 32px;
    flex-wrap: wrap;
  }
  .footer-follow .qr-card {
    background: #fff;
    border-radius: var(--radius-md);
    padding: 16px 16px 14px;
    width: 148px;
    position: relative;
    box-shadow: var(--shadow-sm), var(--shadow-md);
    border: 0.5px solid rgba(0,0,0,0.04);
    transition: transform 0.3s ease, box-shadow 0.3s ease;
  }
  .footer-follow .qr-card:hover {
    transform: translateY(-3px);
    box-shadow: var(--shadow-sm), var(--shadow-lg);
  }
  .footer-follow .qr-card img {
    width: 104px;
    height: 104px;
    display: block;
    margin: 0 auto 12px;
    border-radius: 6px;
    position: relative;
    z-index: 2;
  }
  .footer-follow .qr-card .label {
    font-size: 13px;
    color: var(--text-body);
    letter-spacing: 1.5px;
    font-weight: 500;
    position: relative;
    z-index: 2;
  }
  .footer-follow .qr-card .sublabel {
    font-size: 11px;
    color: var(--text-faint);
    letter-spacing: 0.5px;
    margin-top: 1px;
    position: relative;
    z-index: 2;
  }

  /* ============================================
     响应式
     ============================================ */
  @media (max-width: 800px) {
    .header { padding: 48px 20px 36px; }
    .header h1 { font-size: 28px; }

    .book-grid {
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 18px;
      padding: 28px 16px 60px;
    }

    .footer-follow { padding: 40px 20px 44px; }
    .footer-follow .qr-row { gap: 24px; }
    .footer-follow .qr-card { width: 140px; padding: 14px 14px 12px; }
    .footer-follow .qr-card img { width: 96px; height: 96px; }

    .gallery-overlay { padding: 14px; }
    .gallery-grid {
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-top: 14px;
    }
    .detail-image-wrap { padding: 56px 24px; }
    .detail-nav button { width: 36px; height: 36px; font-size: 18px; }
  }

  @media (max-width: 500px) {
    .book-grid {
      grid-template-columns: 1fr;
      max-width: 360px;
    }
    .footer-follow { padding: 32px 16px 36px; }
    .footer-follow .qr-row { gap: 16px; flex-direction: column; align-items: center; }
    .footer-follow .qr-card { width: 132px; }
    .footer-follow .qr-card img { width: 88px; height: 88px; }
    .gallery-grid {
      grid-template-columns: 1fr;
      max-width: 400px;
    }
    .detail-image-wrap { padding: 48px 12px; }
    .detail-nav button { width: 32px; height: 32px; font-size: 16px; }
  }

  /* ===== 滚动条美化 ===== */
  .gallery-overlay::-webkit-scrollbar { width: 5px; }
  .gallery-overlay::-webkit-scrollbar-track { background: transparent; }
  .gallery-overlay::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }

  /* ===== 进入动画 ===== */
  @keyframes card-enter {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  /* animation-delay 由 JS 动态设置，支持任意数量卡片 */
  .book-card {
    animation: card-enter 0.5s ease both;
  }

  /* ============================================
     卡片详情/滑动模式 — 小红书风格
     ============================================ */
  .gallery-detail {
    display: none;
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.95);
    z-index: 10;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .gallery-detail.active { display: flex; }

  .detail-header {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 20px;
    z-index: 5;
  }
  .detail-back {
    background: rgba(255,255,255,0.08);
    border: none;
    color: rgba(255,255,255,0.7);
    padding: 8px 18px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
    letter-spacing: 1px;
    transition: background 0.2s, color 0.2s;
  }
  .detail-back:hover { background: rgba(255,255,255,0.15); color: #fff; }
  .detail-close {
    background: none;
    border: none;
    color: rgba(255,255,255,0.3);
    font-size: 28px;
    cursor: pointer;
    padding: 4px 8px;
    line-height: 1;
    transition: color 0.2s;
  }
  .detail-close:hover { color: rgba(255,255,255,0.8); }

  .detail-image-wrap {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 100%;
    padding: 64px 80px;
  }
  .detail-image-wrap img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    border-radius: 8px;
    box-shadow: 0 8px 48px rgba(0,0,0,0.4);
    user-select: none;
    -webkit-user-drag: none;
    transition: opacity 0.25s ease;
  }

  .detail-counter {
    position: absolute;
    bottom: 28px;
    color: rgba(255,255,255,0.35);
    font-size: 14px;
    letter-spacing: 3px;
    font-variant-numeric: tabular-nums;
  }

  .detail-nav {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    left: 0;
    right: 0;
    display: flex;
    justify-content: space-between;
    padding: 0 16px;
    pointer-events: none;
  }
  .detail-nav button {
    pointer-events: auto;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.08);
    color: rgba(255,255,255,0.5);
    width: 44px;
    height: 44px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 22px;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .detail-nav button:hover {
    background: rgba(255,255,255,0.15);
    color: #fff;
  }
  .detail-nav button:disabled {
    opacity: 0.15;
    cursor: default;
  }

  /* ============================================
     版权声明
     ============================================ */
  .footer-copyright {
    text-align: center;
    padding: 24px 24px 28px;
    font-size: 12px;
    color: var(--text-faint);
    letter-spacing: 0.5px;
    border-top: 0.5px solid rgba(0,0,0,0.04);
  }
</style>
</head>

const books = [

  {

// ===== HTML 转义工具函数（防 XSS）=====
function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// ===== 渲染书籍网格 =====
function renderGrid() {
  const grid = document.getElementById("bookGrid");
  const count = document.getElementById("bookCount");

  if (books.length === 0) {
    grid.innerHTML = '';
    const empty = document.createElement('div');
    empty.className = 'empty-state';
    empty.innerHTML =
      '<div class="icon">&#128214;</div>' +
      '<p>还没有读书卡片<br>完成第一本书的卡片制作后，它会出现在这里</p>';
    grid.appendChild(empty);
    count.textContent = "共 0 本书";
    return;
  }

  count.textContent = "共 " + books.length + " 本书";
  grid.innerHTML = '';

  books.forEach(function(book, index) {
    const card = document.createElement('div');
    card.className = 'book-card';
    card.setAttribute('role', 'button');
    card.setAttribute('tabindex', '0');
    card.setAttribute('aria-label', '打开《' + book.title + '》的6张图文卡片');

    const cover = document.createElement('div');
    cover.className = 'cover';
    const img = document.createElement('img');
    img.src = book.path + '/card-01.png';
    img.alt = book.title + ' 封面';
    img.loading = 'lazy';
    cover.appendChild(img);

    const info = document.createElement('div');
    info.className = 'info';

    const tag = document.createElement('div');
    tag.className = 'book-tag';
    tag.textContent = book.tag;

    const title = document.createElement('div');
    title.className = 'book-title';
    title.textContent = book.title;

    const author = document.createElement('div');
    author.className = 'book-author';
    author.textContent = book.author;

    const meta = document.createElement('div');
    meta.className = 'book-meta';
    const span1 = document.createElement('span');
    span1.textContent = book.date;
    const sep = document.createElement('span');
    sep.className = 'sep';
    sep.textContent = '·';
    const span2 = document.createElement('span');
    span2.textContent = '6 张卡片';
    meta.appendChild(span1);
    meta.appendChild(sep);
    meta.appendChild(span2);

    info.appendChild(tag);
    info.appendChild(title);
    info.appendChild(author);
    info.appendChild(meta);

    card.appendChild(cover);
    card.appendChild(info);
    grid.appendChild(card);

    card.addEventListener('click', function() { openGallery(index); });
    card.addEventListener('keydown', function(e) {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        openGallery(index);
      }
    });

    card.style.animationDelay = (index * 0.04) + 's';
  });
}

// ===== 灯箱控制 =====
let currentGalleryIndex = -1;
let focusTrapHandler = null;

function openGallery(index) {
  const book = books[index];
  if (!book) return;
  currentGalleryIndex = index;

  const overlay = document.getElementById("gallery");
  const titleEl = document.getElementById("galleryTitle");
  const grid = document.getElementById("galleryGrid");

  overlay.setAttribute('data-book', book.id);
  titleEl.innerHTML = '<strong>' + escapeHtml(book.title) + '</strong> · ' + escapeHtml(book.author) + ' · 共 6 张';

  grid.innerHTML = '';
  for (let i = 1; i <= 6; i++) {
    const num = String(i).padStart(2, "0");
    const div = document.createElement("div");
    div.className = "gallery-card";
    div.setAttribute('data-src', book.path + '/card-' + num + '.png');
    div.setAttribute('data-alt', book.title + ' 卡片 ' + i);
    div.setAttribute('data-index', i - 1);
    div.style.background = 'rgba(255,255,255,0.03)';
    grid.appendChild(div);
  }

  document.getElementById('galleryDetail').classList.remove('active');
  overlay.classList.add("active");
  document.body.style.overflow = "hidden";

  overlay.focus();
  observeGalleryImages();
  setupFocusTrap(overlay);
}

function closeGallery() {
  const overlay = document.getElementById("gallery");
  closeDetail();
  overlay.classList.remove("active");
  overlay.removeAttribute('data-book');
  document.body.style.overflow = "";
  currentGalleryIndex = -1;

  if (focusTrapHandler) {
    document.removeEventListener('keydown', focusTrapHandler);
    focusTrapHandler = null;
  }
}

// ===== 卡片详情/滑动模式 =====
let detailIndex = 0;

function openDetail(index) {
  const book = books[currentGalleryIndex];
  if (!book) return;
  detailIndex = index;
  updateDetailImage();
  document.getElementById('galleryDetail').classList.add('active');
}

function closeDetail() {
  document.getElementById('galleryDetail').classList.remove('active');
}

function updateDetailImage() {
  const book = books[currentGalleryIndex];
  if (!book) return;
  const img = document.getElementById('detailImage');
  const counter = document.getElementById('detailCounter');
  document.getElementById('detailPrev').disabled = (detailIndex === 0);
  document.getElementById('detailNext').disabled = (detailIndex === 5);

  const num = String(detailIndex + 1).padStart(2, '0');
  img.src = book.path + '/card-' + num + '.png';
  img.alt = book.title + ' 卡片 ' + (detailIndex + 1);
  counter.textContent = (detailIndex + 1) + ' / 6';
}

function navigateDetail(dir) {
  const next = detailIndex + dir;
  if (next < 0 || next > 5) return;
  detailIndex = next;
  updateDetailImage();
}

// ===== 灯箱图片懒加载 =====
function observeGalleryImages() {
  const cards = document.querySelectorAll('.gallery-card[data-src]:not([data-loaded])');
  if (!cards.length) return;

  const observer = new IntersectionObserver(function(entries) {
    entries.forEach(function(entry) {
      if (entry.isIntersecting) {
        const card = entry.target;
        loadGalleryImage(card);
        observer.unobserve(card);
      }
    });
  }, { rootMargin: '200px' });

  cards.forEach(function(card) { observer.observe(card); });
}

function loadGalleryImage(card) {
  if (card.hasAttribute('data-loaded')) return;
  card.setAttribute('data-loaded', '1');

  const img = document.createElement('img');
  img.src = card.getAttribute('data-src');
  img.alt = card.getAttribute('data-alt') || '';
  img.onload = function() { img.classList.add('loaded'); };
  card.appendChild(img);
  card.style.background = 'transparent';

  // 点击进入详情/滑动模式
  card.addEventListener('click', function() {
    const idx = parseInt(card.getAttribute('data-index'));
    if (!isNaN(idx)) openDetail(idx);
  });
  card.style.cursor = 'pointer';
}

// ===== 焦点陷阱 =====
function setupFocusTrap(container) {
  if (focusTrapHandler) {
    document.removeEventListener('keydown', focusTrapHandler);
  }

  const focusableSelector = 'button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])';
  const focusableElements = container.querySelectorAll(focusableSelector);
  const firstEl = focusableElements[0];
  const lastEl = focusableElements[focusableElements.length - 1];

  focusTrapHandler = function(e) {
    if (e.key !== 'Tab') return;
    if (e.shiftKey) {
      if (document.activeElement === firstEl) {
        e.preventDefault();
        lastEl.focus();
      }
    } else {
      if (document.activeElement === lastEl) {
        e.preventDefault();
        firstEl.focus();
      }
    }
  };

  document.addEventListener('keydown', focusTrapHandler);
  if (firstEl) firstEl.focus();
}

// ===== 键盘导航 =====
document.addEventListener("keydown", function(e) {
  const detail = document.getElementById("galleryDetail");
  if (detail.classList.contains("active")) {
    if (e.key === "Escape") { closeDetail(); return; }
    if (e.key === "ArrowLeft") { e.preventDefault(); navigateDetail(-1); return; }
    if (e.key === "ArrowRight") { e.preventDefault(); navigateDetail(1); return; }
    return;
  }
  if (e.key === "Escape") closeGallery();
});

// ===== 按钮事件绑定 =====
document.getElementById("galleryClose").addEventListener("click", closeGallery);
document.getElementById("detailBack").addEventListener("click", closeDetail);
document.getElementById("detailClose").addEventListener("click", closeGallery);
document.getElementById("galleryDetail").addEventListener("click", function(e) {
  if (e.target === this || e.target.classList.contains('detail-image-wrap') || e.target.tagName === 'DIV' && e.target.parentElement?.classList.contains('detail-image-wrap')) {
    closeDetail();
  }
});
document.getElementById("detailPrev").addEventListener("click", function() { navigateDetail(-1); });
document.getElementById("detailNext").addEventListener("click", function() { navigateDetail(1); });

document.getElementById("gallery").addEventListener("click", function(e) {
  if (e.target === this) closeGallery();
});

// ===== 触摸滑动手势 =====
(function setupTouchSwipe() {
  const overlay = document.getElementById('gallery');
  let touchStartX = 0;
  let touchStartY = 0;
  let isSwiping = false;

  overlay.addEventListener('touchstart', function(e) {
    touchStartX = e.changedTouches[0].screenX;
    touchStartY = e.changedTouches[0].screenY;
    isSwiping = true;
  }, { passive: true });

  overlay.addEventListener('touchend', function(e) {
    if (!isSwiping) return;
    isSwiping = false;
    const dx = e.changedTouches[0].screenX - touchStartX;
    const dy = e.changedTouches[0].screenY - touchStartY;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) {
      const detail = document.getElementById("galleryDetail");
      if (detail.classList.contains("active")) {
        if (dx < 0) navigateDetail(1);
        else navigateDetail(-1);
      }
    }
  }, { passive: true });
})();

renderGrid();
</script>
